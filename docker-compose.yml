services:
  roscatv:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-amoszp}/roscatv:${ROSCATV_TAG:-latest}
    container_name: roscatv
    restart: unless-stopped
    ports:
      - "${ROSCATV_PORT:-1100}:3000"
    env_file:
      - ./.env
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      # Host-side folder that keeps the SQLite database across updates
      # (owned by uid 1001, the user the app runs as).
      - ./data:/app/data
    networks:
      - default
      - accounts

networks:
  accounts:
    # Created by the accounts service's compose file.
    external: true
